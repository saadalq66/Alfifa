name: Spin Studio

on:
  push:
    branches: [main]
    paths: ['spin-studio/**', '.github/workflows/spin-studio.yml']
  pull_request:
    paths: ['spin-studio/**', '.github/workflows/spin-studio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spin-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spin-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spin-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: spin-studio/dist

  # Requires Settings → Pages → Source: "GitHub Actions" (one-time).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
